<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(66, 96, 185);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: white;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 0 auto;
            max-width: 700px;
            justify-content: center;
        }
        .section {
            background-color: #db6520;
            border: 3px solid white;
            width: 300px;
            height: 150px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px 25px;
            border-radius: 12px;
            box-sizing: border-box;
            color: white;
        }

        label {
            margin-right: 8px;
            font-weight: bold ;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        input[type = "text"] {
            padding: 8px;
            width: 80%;
            border: none;
            border-radius: 4px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 id="main_header">INST377 Lab 4</h1>
    <div class = "container">
        <div class = "section" id ="alert_section">
            <form id = "alert_form" onsubmit = "handle_alert(event)">
                <label for = "name_input">Name:</label>
                <input type= "text" id = "name_input" name = "name" required>
                <button type = "submit">Alert Me!</button>
            </form>
    </div>

    <div class = "section" id = "color_section">
        <button type = "button" onclick = "toggleColor()">Change Color</button>
    </div>

    <div class = "section" id = "text_tester">
        <form id = "text_form" onsubmit = "validateText(event)">
            <label for = "text_input">Text Tester:</label>
            <input type = "text" id = "text_input">
            <button type = "submit">Validate Text</button>
        </form>
    </div>

    <div class = "section" id = "add_text">
        <button type = "button" onclick = "addTextHeading()"> Add Text</button>
    </div>

    <script>
        var validation = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/;

        function handle_alert(event) {
            event.preventDefault();
            var name = document.getElementById("name_input").value;
            alert("Hi " + name + "!");
        }

        var isBlue = true;
        function toggleColor() {
            if (isBlue) {
                document.body.style.backgroundColor = "black";
                isBlue = false;
            } else {
                document.body.style.backgroundColor = "rgb(66, 96, 185)";
                isBlue = true;
            }
        }

        function validateText(event) {
            event.preventDefault();
            var text = document.getElementById("text_input").value;
            if (validation.test(text)) {
                alert("Invalid input: Special characters are not allowed.");
            } else {
                alert("Valid input: No special characters detected.");
            }
        }

        function addTextHeading() {
            var new_heading = document.getElementById("main_header");
            new_heading.textContent = "Add Text!";
            if (!new_heading.textContent.includes("This is a new heading!")) {
                new_heading.textContent += "This is a new heading!";
            }
        }
    </script>
</body>
</html>
