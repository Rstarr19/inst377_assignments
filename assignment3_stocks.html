<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stocks</title>

  <!-- Css -->
  <link rel="stylesheet" href="assignment3_style.css">

  <!-- Annyang -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <!-- Navigation -->
  <ul class="navbar">
    <li><a href="assignment3_index.html">Home</a></li>
    <li><a href="assignment3_stocks.html">Stocks</a></li>
    <li><a href="assignment3_dogs.html">Dogs</a></li>
  </ul>


  <!-- Title -->
  <h1>Stock Lookup</h1>


  <!-- Input -->

  <div>
    <input type="text" id="ticker" placeholder="Enter Stock Ticker (e.g. AAPL)">

    <select id="days">
      <option value="30">30 Days</option>
      <option value="60">60 Days</option>
      <option value="90">90 Days</option>
    </select>

    <button onclick="getStock()">Search</button>
  </div>


  <!-- Chart -->

  <canvas id="stockChart" width="600" height="300"></canvas>


  <!-- Stock Table -->
  <h2>Top 5 Trending Stocks (Reddit)</h2>

  <table id="stockTable">
    <tr>
      <th>Ticker</th>
      <th>Mentions</th>
      <th>Sentiment</th>
      <th>Trend</th>
    </tr>
  </table>


  <!-- Auido -->

  <div class="audio-box">
    <h3>Voice Commands</h3>
    <p>Say "Hello"</p>
    <p>Say "Change the color to blue"</p>
    <p>Say "Navigate to home"</p>
    <p>Say "Lookup MSFT"</p>

    <button onclick="annyang.start()">Turn On Audio</button>
    <button onclick="annyang.abort()">Turn Off Audio</button>
  </div>

  <!-- Js -->
  <script src="assignment3_script.js"></script>

</body>
</html>
